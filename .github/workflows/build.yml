# CI: tests on Linux, an unsigned iOS .ipa on macOS.
#
# Why this exists
# ---------------
# Building for iOS requires macOS -- not by policy but mechanically: Flutter's
# ios_workflow.dart gates on isMacOS, and `flutter build` offers no ios/ipa
# subcommand at all on Linux. A hosted macOS runner is the way to build an iOS
# app without owning a Mac.
#
# Cost: GitHub's macOS runners are free and unmetered on PUBLIC repositories.
# On a private repo they bill against the 2,000 min/month free tier at a 10x
# multiplier -- about 200 macOS minutes a month, which one of these builds can
# eat a noticeable slice of. If this repo is private, expect to watch the quota.
#
# The .ipa this produces is UNSIGNED beyond an ad-hoc signature. It is not
# installable from a browser; it is the input to a sideloader (SideStore,
# AltStore) which applies your own free Apple ID's 7-day certificate on device.
# No Apple Developer Program membership and no secrets are needed to run this
# workflow -- that is the point of keeping signing out of CI.

name: build

# Two pushes in quick succession would otherwise race to deploy Pages, and the
# older build can win. Queued rather than cancelled: the earlier build's release
# is still wanted, it just must not publish the source after the newer one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on Linux because it is faster and, on a private repo, 10x cheaper.
  # Nothing here needs macOS.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not 'any': a CI that silently follows stable will one day
          # fail on a Flutter change unrelated to anything in this repo.
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: test
    # Pinned rather than macos-latest so an Xcode bump is a deliberate commit
    # and not a surprise red build.
    runs-on: macos-15
    permissions:
      # Only so this job can cut a release. Everything else the built-in token
      # can reach stays read-only, and no other secret is involved anywhere in
      # this workflow -- which is what lets a fork run it unchanged.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - run: flutter pub get

      # NO `pod install` STEP, ON PURPOSE.
      #
      # This project is on Swift Package Manager, not CocoaPods: there is no
      # Podfile and no Podfile.lock in the repo, and every native plugin it
      # uses (universal_ble, just_audio, battery_plus, share_plus, audio_session,
      # sherpa_onnx_ios) ships a Package.swift. `flutter build ios` resolves
      # them itself. Adding `pod install` here would fail with "no Podfile",
      # and adding a Podfile to satisfy it would switch the build back to
      # CocoaPods for no gain.
      #
      # This only holds while SPM is on, which it is by default on the stable
      # channel from the Flutter version pinned above. If that pin ever moves
      # backwards, the build falls back to CocoaPods with a Podfile generated
      # on the fly - unpinned and uncommitted. The pin is load-bearing for a
      # second reason too: AppDelegate.swift conforms to
      # FlutterImplicitEngineDelegate and SceneDelegate.swift subclasses
      # FlutterSceneDelegate, both recent UIScene-migration APIs, so an older
      # Flutter is a compile error rather than a warning.

      # THE VERSION A SIDELOADER CAN TELL APART.
      #
      # The CI run number goes into BOTH version fields:
      #
      #   --build-number=25     -> CFBundleVersion, the source's `buildVersion`
      #   --build-name=1.0.0.25 -> CFBundleShortVersionString, the `version`
      #
      # Without the run number in the build NUMBER, every .ipa is version 1 and
      # "is this the one with the fix?" has no answer once the file is on a
      # phone. Without it in the version NAME, every build calls itself 1.0.0.
      #
      # That second one matters more than it looks. AltStore's rule is that
      # "each entry must have a different version or buildVersion from the
      # previous version" (faq.altstore.io/developers/make-a-source), so
      # buildVersion alone is enough for AltStore itself -- but SideStore is a
      # fork, forks lag, and a client that only looks at `version` would see an
      # unbroken run of 1.0.0 and never offer the update. Putting the build
      # number in both costs nothing and removes that whole class of doubt.
      # It also means the version iOS shows in Settings names the exact build.
      #
      # AltStore 2.0 verifies both fields against the Info.plist inside the
      # .ipa and refuses to install on a mismatch, so these two numbers and the
      # ones in the source JSON have to come from the same place. They do: the
      # source JSON is generated from the plist of the bundle built right here.
      #
      # The marketing half comes from pubspec.yaml, so bumping the release
      # version there is the one place that decides what the app calls itself.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          MARKETING=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          test -n "$MARKETING" || { echo "::error::no version: line in pubspec.yaml"; exit 1; }
          BUILD=${{ github.run_number }}
          {
            echo "marketing=$MARKETING"
            echo "build=$BUILD"
            echo "full=$MARKETING.$BUILD"
            echo "tag=ios-v$MARKETING.$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "building $MARKETING.$BUILD (CFBundleVersion $BUILD)"

      # --no-codesign is what makes this possible without an Apple account:
      # it skips the signing identity that CI does not have and cannot get.
      - name: Build unsigned Runner.app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.full }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Ad-hoc sign and package as .ipa
        run: |
          set -euo pipefail
          cd build/ios/iphoneos

          # An .ipa is a zip with the bundle inside a top-level Payload/.
          mkdir -p Payload
          cp -R Runner.app Payload/

          # THE STEP THAT IS EASY TO MISS.
          #
          # A completely unsigned Flutter build crashes the sideloader rather
          # than failing cleanly: AltStore/SideStore sign with ldid, and ldid
          # aborts on the unsigned embedded frameworks with
          #     _assert(): end >= size - 0x10
          # which reads like a corrupt download, not a missing signature.
          #
          # An ad-hoc signature (-s -) gives every Mach-O a well-formed, empty
          # signature for ldid to replace. Inside-out: frameworks before the
          # bundle that contains them, or the outer signature is invalidated.
          if compgen -G "Payload/Runner.app/Frameworks/*" > /dev/null; then
            codesign -s - -f Payload/Runner.app/Frameworks/*
          fi
          codesign -s - -f Payload/Runner.app

          zip -qr voicenotetaker.ipa Payload
          ls -lh voicenotetaker.ipa

      # A green build is not the same as an installable app. Everything below
      # was checked by hand once and then automated, because each failure is
      # silent: the build stays green and the app misbehaves on the phone.
      - name: Check the .ipa is actually installable
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          APP=Payload/Runner.app

          test -f "$APP/Info.plist"   || { echo "::error::no Info.plist"; exit 1; }
          test -x "$APP/Runner"       || { echo "::error::no Runner executable"; exit 1; }

          # Ad-hoc signatures, inside-out. A missing one here is what makes
          # ldid abort in the sideloader with a corrupt-looking error rather
          # than saying the bundle is unsigned.
          test -d "$APP/_CodeSignature" || { echo "::error::app bundle unsigned"; exit 1; }
          for fw in "$APP"/Frameworks/*.framework; do
            test -d "$fw/_CodeSignature" || {
              echo "::error::unsigned framework: $(basename "$fw")"; exit 1; }
          done

          # This app is a BLE client and nothing else. If the plugin ever
          # stops being linked, everything still builds and the app is inert
          # on device -- so assert the symbols are really in the binary.
          #
          # Written to a file rather than piped into grep on purpose. Under
          # `set -o pipefail`, `strings ... | grep -q` fails when the symbol
          # IS found: grep exits at the first match, closes the pipe, and
          # strings dies with "failed to flush output". The check then reports
          # exactly the opposite of the truth.
          strings -a "$APP/Runner" > /tmp/runner-strings.txt
          grep -q 'universal_ble' /tmp/runner-strings.txt || {
            echo "::error::universal_ble is not linked into Runner"; exit 1; }

          # Apple's Developer Portal derives the App ID name from CFBundleName
          # and accepts ONLY letters, digits and spaces. Flutter's default is
          # the Dart package name, which contains an underscore -- and that
          # fails at INSTALL time, on device, with
          #   Developer error 35: An invalid value '<name>' was provided for
          #   the parameter 'appIdName'
          # long after CI has gone green. Catch it here instead.
          BUNDLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist")
          case "$BUNDLE_NAME" in
            *[!A-Za-z0-9\ ]*)
              echo "::error::CFBundleName '$BUNDLE_NAME' has characters Apple rejects in appIdName (letters, digits and spaces only)"
              exit 1 ;;
          esac

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier'  "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName'        "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'     "$APP/Info.plist"
          echo "ipa looks installable"

      # DESCRIBE THE .ipa IN A FILE THAT TRAVELS WITH IT.
      #
      # Everything the source JSON needs about this build is read out of the
      # bundle that was just zipped -- never retyped, never inferred later.
      # AltStore 2.0 verifies `version`, `buildVersion` and `appPermissions`
      # against the downloaded .ipa and refuses the install when any of them
      # disagree, so the only safe place to read them is here, from the plist
      # inside the very file being published.
      #
      # This lands as a second release asset next to the .ipa. That is what
      # makes the source's whole version history rebuildable from the releases
      # alone: no state is kept in the repo, so the JSON can never claim a
      # build that is not actually downloadable.
      - name: Describe the build for the source JSON
        id: meta
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          APP=Payload/Runner.app
          SHA=$(shasum -a 256 voicenotetaker.ipa | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          # AltStore checks the app's declared permissions against the .ipa, so
          # these are extracted rather than written by hand.
          #
          # privacy: every NS*UsageDescription in the built Info.plist, as a
          #   key -> reason map, which is the shape make-a-source documents.
          # entitlements: whatever is embedded in the signature. With
          #   --no-codesign plus an ad-hoc `codesign -s -` there are none, and
          #   an empty list is the honest answer -- the sideloader adds its own
          #   when it re-signs with the user's Apple ID.
          python3 - "$APP/Info.plist" "$SHA" <<'PY' > build.json
          import json, plistlib, subprocess, sys, datetime, os
          plist_path, sha = sys.argv[1], sys.argv[2]
          info = plistlib.load(open(plist_path, 'rb'))
          # The changelog SideStore shows. Trailers are for git, not for a
          # person reading "what changed" on their phone. A manual run has no
          # commit message at all, hence the fallback.
          msg = os.environ.get('COMMIT_SUBJECT') or ''
          notes = '\n'.join(
              l for l in msg.strip().splitlines()
              if not l.startswith(('Co-Authored-By:', 'Claude-Session:',
                                   'Signed-off-by:'))).strip()
          privacy = {k: v for k, v in info.items() if k.endswith('UsageDescription')}
          ents = []
          try:
              raw = subprocess.run(
                  ['codesign', '-d', '--entitlements', ':-', '--xml',
                   os.path.dirname(plist_path)],
                  capture_output=True).stdout
              if raw.strip():
                  ents = sorted(plistlib.loads(raw).keys())
          except Exception:
              pass
          json.dump({
              'bundleIdentifier': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'],
              'buildVersion': info['CFBundleVersion'],
              'minOSVersion': info['MinimumOSVersion'],
              'date': datetime.datetime.now(datetime.timezone.utc)
                       .strftime('%Y-%m-%dT%H:%M:%SZ'),
              'sha256': sha,
              'notes': notes,
              'appPermissions': {'entitlements': ents, 'privacy': privacy},
          }, sys.stdout, indent=2)
          PY
          cat build.json
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}

      # Kept alongside the release. The artifact is the one thing that still
      # exists for a pull request or a manual run, where no release is cut.
      - uses: actions/upload-artifact@v7
        with:
          name: voicenotetaker-ipa-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/ios/iphoneos/voicenotetaker.ipa
            build/ios/iphoneos/build.json
          # A 7-day sideload certificate makes anything older than this
          # useless anyway.
          retention-days: 14

      # THE STABLE DOWNLOAD URL.
      #
      # A workflow artifact cannot be what SideStore downloads from: fetching
      # one needs a logged-in GitHub session, and it is deleted after a
      # fortnight. A release asset on a PUBLIC repo is a plain, permanent,
      # unauthenticated https URL, which is exactly what a source's
      # `downloadURL` has to be.
      #
      # The tag is immutable and per-build (ios-v1.0.0.25) rather than a
      # rolling "ios-latest" that gets re-pointed. Two reasons: SideStore shows
      # a version history and offers older builds, so every entry in that list
      # needs its own URL that keeps serving the same bytes; and a moving tag
      # would make the sha256 in the source go stale the moment it moved,
      # which AltStore reports as a failed install rather than a stale source.
      #
      # Only on a real push to master -- a pull request from a fork has a
      # read-only token, and a green PR is not a build anyone should install.
      - name: Publish the .ipa as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # COMMIT_SUBJECT travels through the environment rather than being
        # interpolated by ${{ }}: a commit message is arbitrary text, and
        # interpolation would paste it straight into the shell.
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          NOTES=$(printf '%s\n\n---\n\nUnsigned build of %s.\nInstall it with SideStore - see doc/ios-install.md.\n\nsha256 %s\n' \
                    "$COMMIT_SUBJECT" "$GITHUB_SHA" "${{ steps.meta.outputs.sha256 }}")
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iOS ${{ steps.version.outputs.full }}" \
            --notes "$NOTES" \
            voicenotetaker.ipa build.json
  # Regenerating the source JSON is plain HTTP and JSON, so it runs on Linux:
  # faster, and a tenth of the cost if this repo ever goes private.
  source:
    needs: [test, ios]
    # `always()` so a broken iOS build does not also take the source down with
    # it. This job does not publish the build that just ran -- it describes the
    # releases that EXIST, which is a different question. When the macOS build
    # fails there is simply no new release to find, the same JSON is republished,
    # and the phone keeps being able to install the last good build. Holding the
    # source hostage to the newest build would turn one red build into "nobody
    # can install anything".
    #
    # The Linux tests stay a hard gate: nothing is published off a red test run.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Deleting the releases that fell off the end of the history.
      contents: write
      # Publishing to Pages, which is an OIDC-authenticated deployment rather
      # than a commit. No secret beyond the built-in token is involved.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # KEEP THE HISTORY BOUNDED.
      #
      # SideStore shows older versions and will install one, so keeping a few
      # is genuinely useful -- but one release per push grows without limit and
      # every one of them holds a ~50 MB .ipa forever. Ten is about a month of
      # work, and far more than a certificate that expires in 7 days can make
      # use of. Pruned BEFORE the JSON is generated so the two always agree.
      #
      # --cleanup-tag takes the tag with it; a tag left behind with no release
      # is a dangling ref that makes `git tag` lie about what is installable.
      - name: Keep only the last 10 iOS releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `|| true` on the grep, not sloppiness: under `set -o pipefail` a
          # grep that matches nothing exits 1 and takes the whole step with it.
          # That is the state the very first run is in, and the state the repo
          # returns to if every release is ever deleted by hand.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[].tagName' \
            | { grep '^ios-v' || true; } \
            | sort -Vr \
            | tail -n +11 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done

      - name: Build the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p _site

          # The source's icon is the app's own 1024x1024 icon, copied out of the
          # asset catalogue rather than drawn again, so the circle in SideStore
          # and the squircle on the home screen can never disagree. AltStore
          # documents no size or format requirement; it masks whatever it gets,
          # so a square PNG is the safe shape.
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png \
             _site/icon.png

          python3 tool/altstore_source.py \
            --repo "$GITHUB_REPOSITORY" \
            --pages-url "$PAGES_URL" > _site/apps.json

          # THE STEP THAT CAUGHT THIS THE HARD WAY.
          #
          # A source SideStore cannot decode does not degrade gracefully: there
          # is no partial load and no app-by-app skipping. One bad field throws,
          # and the user sees "Decoding failed: Data corrupted" with nothing
          # installable behind it. `json.load()` is perfectly happy with such a
          # document, so a Linux runner cannot notice on its own.
          #
          # check_altstore_source.py is a mirror of SideStore's own Codable
          # implementations, read out of its source rather than from the AltStore
          # docs -- the docs describe AltStore 2.x, and SideStore forked the 1.x
          # line, which is exactly how this source shipped broken once.
          python3 tool/check_altstore_source.py _site/apps.json

          # A human landing page at the same URL, so someone who opens the link
          # in Safari gets an install button instead of a wall of JSON.
          SRC="$PAGES_URL/apps.json"
          cat > _site/index.html <<HTML
          <!doctype html><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>voiceNotetaker for iPhone</title>
          <style>
          body{background:#0B0A0F;color:#F4F1FB;font:16px/1.6 -apple-system,system-ui,sans-serif;
               margin:0;padding:48px 20px;display:flex;flex-direction:column;align-items:center}
          main{max-width:34rem}img{width:96px;border-radius:22px}
          a.btn{display:inline-block;background:#8B5CF6;color:#fff;text-decoration:none;
                padding:12px 20px;border-radius:12px;font-weight:600}
          code{background:#14121B;padding:2px 6px;border-radius:6px;word-break:break-all}
          p{color:#9A93AC}h1{color:#F4F1FB}
          </style>
          <main>
          <img src=icon.png alt="">
          <h1>voiceNotetaker for iPhone</h1>
          <p>This page is a SideStore source. Open it on the iPhone that has
          SideStore installed and tap the button, or paste the address below
          into SideStore &rarr; Browse &rarr; Sources &rarr; +.</p>
          <p><a class=btn href="sidestore://source?url=$SRC">Add to SideStore</a></p>
          <p><code>$SRC</code></p>
          <p>The app is signed with your own free Apple ID and stops opening
          after 7 days unless SideStore refreshes it.
          <a href="https://github.com/$GITHUB_REPOSITORY/blob/master/doc/ios-install.md"
             style="color:#A78BFA">How to install it &rarr;</a></p>
          </main>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
