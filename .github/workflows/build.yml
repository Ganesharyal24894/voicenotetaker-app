# CI: tests on Linux, an unsigned iOS .ipa on macOS.
#
# Why this exists
# ---------------
# Building for iOS requires macOS -- not by policy but mechanically: Flutter's
# ios_workflow.dart gates on isMacOS, and `flutter build` offers no ios/ipa
# subcommand at all on Linux. A hosted macOS runner is the way to build an iOS
# app without owning a Mac.
#
# Cost: GitHub's macOS runners are free and unmetered on PUBLIC repositories.
# On a private repo they bill against the 2,000 min/month free tier at a 10x
# multiplier -- about 200 macOS minutes a month, which one of these builds can
# eat a noticeable slice of. If this repo is private, expect to watch the quota.
#
# The .ipa this produces is UNSIGNED beyond an ad-hoc signature. It is not
# installable from a browser; it is the input to a sideloader (SideStore,
# AltStore) which applies your own free Apple ID's 7-day certificate on device.
# No Apple Developer Program membership and no secrets are needed to run this
# workflow -- that is the point of keeping signing out of CI.

name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on Linux because it is faster and, on a private repo, 10x cheaper.
  # Nothing here needs macOS.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not 'any': a CI that silently follows stable will one day
          # fail on a Flutter change unrelated to anything in this repo.
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: test
    # Pinned rather than macos-latest so an Xcode bump is a deliberate commit
    # and not a surprise red build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - run: flutter pub get

      # NO `pod install` STEP, ON PURPOSE.
      #
      # This project is on Swift Package Manager, not CocoaPods: there is no
      # Podfile and no Podfile.lock in the repo, and every native plugin it
      # uses (universal_ble, just_audio, battery_plus, share_plus, audio_session,
      # sherpa_onnx_ios) ships a Package.swift. `flutter build ios` resolves
      # them itself. Adding `pod install` here would fail with "no Podfile",
      # and adding a Podfile to satisfy it would switch the build back to
      # CocoaPods for no gain.
      #
      # This only holds while SPM is on, which it is by default on the stable
      # channel from the Flutter version pinned above. If that pin ever moves
      # backwards, the build falls back to CocoaPods with a Podfile generated
      # on the fly - unpinned and uncommitted. The pin is load-bearing for a
      # second reason too: AppDelegate.swift conforms to
      # FlutterImplicitEngineDelegate and SceneDelegate.swift subclasses
      # FlutterSceneDelegate, both recent UIScene-migration APIs, so an older
      # Flutter is a compile error rather than a warning.

      # --no-codesign is what makes this possible without an Apple account:
      # it skips the signing identity that CI does not have and cannot get.
      #
      # The build number is the CI run number so two .ipa files are always
      # tellable apart. Without it every build is version 1 and "is this the
      # one with the fix?" has no answer once the file is on a phone.
      - name: Build unsigned Runner.app
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Ad-hoc sign and package as .ipa
        run: |
          set -euo pipefail
          cd build/ios/iphoneos

          # An .ipa is a zip with the bundle inside a top-level Payload/.
          mkdir -p Payload
          cp -R Runner.app Payload/

          # THE STEP THAT IS EASY TO MISS.
          #
          # A completely unsigned Flutter build crashes the sideloader rather
          # than failing cleanly: AltStore/SideStore sign with ldid, and ldid
          # aborts on the unsigned embedded frameworks with
          #     _assert(): end >= size - 0x10
          # which reads like a corrupt download, not a missing signature.
          #
          # An ad-hoc signature (-s -) gives every Mach-O a well-formed, empty
          # signature for ldid to replace. Inside-out: frameworks before the
          # bundle that contains them, or the outer signature is invalidated.
          if compgen -G "Payload/Runner.app/Frameworks/*" > /dev/null; then
            codesign -s - -f Payload/Runner.app/Frameworks/*
          fi
          codesign -s - -f Payload/Runner.app

          zip -qr voicenotetaker.ipa Payload
          ls -lh voicenotetaker.ipa

      # A green build is not the same as an installable app. Everything below
      # was checked by hand once and then automated, because each failure is
      # silent: the build stays green and the app misbehaves on the phone.
      - name: Check the .ipa is actually installable
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          APP=Payload/Runner.app

          test -f "$APP/Info.plist"   || { echo "::error::no Info.plist"; exit 1; }
          test -x "$APP/Runner"       || { echo "::error::no Runner executable"; exit 1; }

          # Ad-hoc signatures, inside-out. A missing one here is what makes
          # ldid abort in the sideloader with a corrupt-looking error rather
          # than saying the bundle is unsigned.
          test -d "$APP/_CodeSignature" || { echo "::error::app bundle unsigned"; exit 1; }
          for fw in "$APP"/Frameworks/*.framework; do
            test -d "$fw/_CodeSignature" || {
              echo "::error::unsigned framework: $(basename "$fw")"; exit 1; }
          done

          # This app is a BLE client and nothing else. If the plugin ever
          # stops being linked, everything still builds and the app is inert
          # on device -- so assert the symbols are really in the binary.
          #
          # Written to a file rather than piped into grep on purpose. Under
          # `set -o pipefail`, `strings ... | grep -q` fails when the symbol
          # IS found: grep exits at the first match, closes the pipe, and
          # strings dies with "failed to flush output". The check then reports
          # exactly the opposite of the truth.
          strings -a "$APP/Runner" > /tmp/runner-strings.txt
          grep -q 'universal_ble' /tmp/runner-strings.txt || {
            echo "::error::universal_ble is not linked into Runner"; exit 1; }

          # Apple's Developer Portal derives the App ID name from CFBundleName
          # and accepts ONLY letters, digits and spaces. Flutter's default is
          # the Dart package name, which contains an underscore -- and that
          # fails at INSTALL time, on device, with
          #   Developer error 35: An invalid value '<name>' was provided for
          #   the parameter 'appIdName'
          # long after CI has gone green. Catch it here instead.
          BUNDLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist")
          case "$BUNDLE_NAME" in
            *[!A-Za-z0-9\ ]*)
              echo "::error::CFBundleName '$BUNDLE_NAME' has characters Apple rejects in appIdName (letters, digits and spaces only)"
              exit 1 ;;
          esac

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier'  "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName'        "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'     "$APP/Info.plist"
          echo "ipa looks installable"

      - uses: actions/upload-artifact@v7
        with:
          name: voicenotetaker-ipa-${{ github.run_number }}-${{ github.sha }}
          path: build/ios/iphoneos/voicenotetaker.ipa
          # A 7-day sideload certificate makes anything older than this
          # useless anyway.
          retention-days: 14
