name: voicenotetaker_app
description: "Companion app for the voiceNotetaker BLE audio recorder."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # BLE transport. BSD-3-Clause, no commercial licence required.
  # See README.md ("Why universal_ble") before swapping this out.
  universal_ble: ^2.3.0

  # Playback of the recorded WAV files. MIT, no commercial licence required.
  # Named in lib/drivers/audio_player_just_audio.dart and nowhere else.
  just_audio: ^0.10.6

  # Per-platform app directories, so recordings land somewhere the OS keeps
  # rather than somewhere it may evict. BSD-3-Clause, maintained by the Flutter
  # team. Named in lib/drivers/app_directories.dart and nowhere else.
  path_provider: ^2.1.6

  # Offline speech-to-text runtime (k2-fsa, Apache-2.0). Runs ONNX models on
  # the CPU with no network. Pinned exactly: the Dart bindings mirror a native
  # C API whose config structs change between releases. Named in
  # lib/drivers/speech_recognizer_sherpa.dart and nowhere else.
  sherpa_onnx: 1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # On-device tests: runs service + engine inside the app on a real phone.
  integration_test:
    sdk: flutter

  # Codegen-free mocking, used for the fake BleTransport in tests.
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Sora, the design's typeface, bundled rather than fetched at runtime: the
  # app must render identically offline and inside `flutter test`, which rules
  # out a runtime Google Fonts download. Only the five weights the design uses.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
