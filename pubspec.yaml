name: voicenotetaker_app
description: "Companion app for the voiceNotetaker BLE audio recorder."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # BLE transport. BSD-3-Clause, no commercial licence required.
  # See README.md ("Why universal_ble") before swapping this out.
  universal_ble: ^2.3.0

  # Playback of the recorded WAV files. MIT, no commercial licence required.
  # Named in lib/drivers/audio_player_just_audio.dart and nowhere else.
  just_audio: ^0.10.6

  # Per-platform app directories, so recordings land somewhere the OS keeps
  # rather than somewhere it may evict. BSD-3-Clause, maintained by the Flutter
  # team. Named in lib/drivers/app_directories.dart and nowhere else.
  path_provider: ^2.1.6

  # Offline speech-to-text runtime (k2-fsa, Apache-2.0). Runs ONNX models on
  # the CPU with no network. Pinned exactly: the Dart bindings mirror a native
  # C API whose config structs change between releases. Named in
  # lib/drivers/speech_recognizer_sherpa.dart and
  # lib/drivers/speaker_diarizer_sherpa.dart, and nowhere else.
  sherpa_onnx: 1.13.8

  # Which transport the phone is on - Wi-Fi or mobile data - so a 197 MB model
  # download is not taken out of someone's data allowance without asking.
  # BSD-3-Clause, Flutter Community, the same family as battery_plus below. No
  # permission on iOS; the plugin's own manifest adds ACCESS_NETWORK_STATE on
  # Android, which is a normal permission with no prompt. Named in
  # lib/drivers/network_status_connectivity.dart and nowhere else.
  #
  # ITS iOS SIDE NEEDS A CURRENT SDK. From 7.1.0 its NWPathMonitor provider
  # reads `NWPath.isUltraConstrained` behind `if #available(iOS 26.0, *)`.
  # That gate is a runtime one; the symbol must still exist when the Swift is
  # compiled, so building this app needs the iOS 26 SDK or newer. CI does -
  # the ios job runs on macos-26 and asserts the SDK version before building.
  # Anyone building on a Mac with Xcode 16 will see
  # "Value of type 'NWPath' has no member 'isUltraConstrained'"; the answer is
  # a newer Xcode, not an older plugin.
  connectivity_plus: ^7.3.1

  # sha256, to check a downloaded model once before it is moved into place.
  # The Dart team's own package (BSD-3-Clause), already in the lock file as a
  # transitive dependency. Named in lib/drivers/hashing_crypto.dart and
  # nowhere else.
  crypto: ^3.0.7

  # Phone battery level, charger state and battery saver, on Android and iOS,
  # for the background-transcription policy. BSD-3-Clause, Flutter Community,
  # no permission, no second engine. Named in
  # lib/drivers/phone_power_battery_plus.dart and nowhere else.
  battery_plus: ^7.1.1

  # The platform share sheet, so a summary prompt can go straight to an AI
  # app instead of through the clipboard. BSD-3-Clause, Flutter Community (a
  # Flutter Favorite), text only - no permission, no file access. The
  # alternative is two MethodChannels of our own (ACTION_SEND and
  # UIActivityViewController) with iPad popover anchoring to get right.
  # Named in lib/drivers/share_sheet_share_plus.dart and nowhere else.
  share_plus: ^13.3.0
  # SMTP, for the one thing this app sends: a spoken instruction, by email, to
  # the user's AI assistant. MIT, pure Dart - no platform channel and no native
  # dependency, so it behaves the same on both phones and can be exercised in a
  # unit test behind the `EmailSender` seam.
  #
  # The alternatives and why not: a provider API (SendGrid, Mailgun, Gmail's
  # REST) puts a third party and an API key between a voice note and the person
  # it was for, and Gmail's own API needs an OAuth consent screen and a Google
  # verification review for a restricted scope; a share intent is not
  # hands-free, which is the whole point; hand-rolled SMTP means writing
  # STARTTLS, AUTH and MIME encoding ourselves. Named in
  # lib/drivers/email_sender_mailer.dart and nowhere else.
  mailer: ^7.2.0

  # The Keychain (iOS) and a hardware-backed AndroidKeyStore key (Android), for
  # the sending account's app password. BSD-3-Clause. The app's other settings
  # are small JSON files in its own directory, which is the wrong place for a
  # password: readable on a rooted phone, and present in a device dump.
  # SharedPreferences is worse - plain XML. Named in
  # lib/drivers/secret_store_secure.dart and nowhere else, behind the
  # `SecretStore` seam so no test ever touches a keystore.
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # On-device tests: runs service + engine inside the app on a real phone.
  integration_test:
    sdk: flutter

  # Codegen-free mocking, used for the fake BleTransport in tests.
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Sora, the design's typeface, bundled rather than fetched at runtime: the
  # app must render identically offline and inside `flutter test`, which rules
  # out a runtime Google Fonts download. Only the five weights the design uses.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
